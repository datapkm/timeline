<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timeline</title>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }

        #iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="iframe-container">
        <iframe id="app-iframe" src="https://script.google.com/macros/s/AKfycbzsYkQ6yj1rCV97jWoQCTaW711pmmR-yJaKzca00LyhytgyCBwWb7S-nbmgq0fG1mif/exec" 
                allow="camera; geolocation; microphone; fullscreen" 
                allowfullscreen>
        </iframe>
    </div>

    <script>
        // Registrasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error("Service Worker Error:", err));
            });
        }

        // Auto-refresh iframe setiap kali aplikasi dibuka atau kembali dari background
        const iframe = document.getElementById('app-iframe');
        const baseUrl = iframe.src.split('?')[0];

        function refreshApp() {
            // Menambahkan timestamp agar browser mengambil data terbaru tanpa cache lama
            iframe.src = baseUrl + '?t=' + new Date().getTime();
        }

        // Refresh saat halaman aktif kembali (terutama untuk PWA mobile)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                refreshApp();
            }
        });

        // Refresh jika halaman dimuat dari cache browser (bfcache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                refreshApp();
            }
        });
    </script>

</body>
</html>
