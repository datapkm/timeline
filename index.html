<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timeline</title>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }

        #iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            background-color: #f8fafc;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- IFRAME CONTAINER -->
    <div id="iframe-container">
        <iframe id="app-iframe" src="https://script.google.com/macros/s/AKfycbzsYkQ6yj1rCV97jWoQCTaW711pmmR-yJaKzca00LyhytgyCBwWb7S-nbmgq0fG1mif/exec" 
                allow="camera; geolocation; microphone; fullscreen" 
                allowfullscreen>
        </iframe>
    </div>

    <script>
        // Registrasi Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error("Service Worker Error:", err));
            });
        }

        // Trik agar iframe memuat data terbaru (bypass cache) HANYA SEKALI saat pertama kali dibuka,
        // tanpa melakukan refresh berulang-ulang di latar belakang.
        window.addEventListener('DOMContentLoaded', () => {
            const iframe = document.getElementById('app-iframe');
            const baseUrl = "https://script.google.com/macros/s/AKfycbzsYkQ6yj1rCV97jWoQCTaW711pmmR-yJaKzca00LyhytgyCBwWb7S-nbmgq0fG1mif/exec";
            
            // Tambahkan timestamp agar logo/data terbaru dari Google Script langsung muncul
            iframe.src = baseUrl + '?t=' + new Date().getTime();
        });
    </script>

</body>
</html>
