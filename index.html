<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timeline</title>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }

        #iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            background-color: #f8fafc;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="iframe-container">
        <iframe id="app-iframe" src="https://script.google.com/macros/s/AKfycbzsYkQ6yj1rCV97jWoQCTaW711pmmR-yJaKzca00LyhytgyCBwWb7S-nbmgq0fG1mif/exec" 
                allow="camera; geolocation; microphone; fullscreen" 
                allowfullscreen>
        </iframe>
    </div>

    <script>
        // Registrasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error("Service Worker Error:", err));
            });
        }

        const baseUrl = "https://script.google.com/macros/s/AKfycbzsYkQ6yj1rCV97jWoQCTaW711pmmR-yJaKzca00LyhytgyCBwWb7S-nbmgq0fG1mif/exec";
        let isRefreshing = false;

        function refreshAppSilently() {
            if (isRefreshing) return;
            isRefreshing = true;

            const container = document.getElementById('iframe-container');
            const oldIframe = document.getElementById('app-iframe');

            // 1. Buat elemen iframe baru
            const newIframe = document.createElement('iframe');
            newIframe.setAttribute('allow', 'camera; geolocation; microphone; fullscreen');
            newIframe.setAttribute('allowfullscreen', 'true');
            newIframe.style.opacity = '0'; 
            
            // 2. WAJIB: Masukkan ke container HINGGA browser bisa mulai merender
            container.appendChild(newIframe);

            // 3. Tangkap event setelah iframe selesai memuat data
            newIframe.onload = () => {
                // Munculkan iframe baru dengan transisi fade-in
                setTimeout(() => {
                    newIframe.style.opacity = '1';
                }, 50);

                // Hapus iframe lama dan kembalikan status
                setTimeout(() => {
                    if (oldIframe && oldIframe.parentNode) {
                        oldIframe.remove();
                    }
                    newIframe.id = 'app-iframe';
                    isRefreshing = false;
                }, 350);
            };

            // 4. Picu pemuatan data ke backend GAS
            newIframe.src = baseUrl + '?t=' + new Date().getTime();
        }

        // Tambahkan delay 300ms agar jaringan HP siap saat aplikasi dibuka dari background
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                setTimeout(refreshAppSilently, 300);
            }
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                setTimeout(refreshAppSilently, 300);
            }
        });
    </script>

</body>
</html>
