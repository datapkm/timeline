<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timeline</title>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }

        #iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            background-color: #f8fafc;
        }

        /* Transisi blur untuk iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            transition: filter 0.4s ease, opacity 0.4s ease;
        }
        iframe.is-refreshing {
            filter: blur(8px);
            opacity: 0.6;
        }

        /* Overlay Loading */
        #refresh-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(248, 250, 252, 0.4);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #refresh-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Animasi Spinner ala Seasons of Sage */
        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(47, 68, 56, 0.15); /* Transparan sage */
            border-left-color: #2f4438; /* Warna primer */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .loading-text {
            color: #2f4438;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="iframe-container">
        <!-- Overlay Loading -->
        <div id="refresh-overlay">
            <div class="spinner"></div>
            <div class="loading-text">Memperbarui Data...</div>
        </div>

        <iframe id="app-iframe" src="https://script.google.com/macros/s/AKfycbzsYkQ6yj1rCV97jWoQCTaW711pmmR-yJaKzca00LyhytgyCBwWb7S-nbmgq0fG1mif/exec" 
                allow="camera; geolocation; microphone; fullscreen" 
                allowfullscreen>
        </iframe>
    </div>

    <script>
        // Registrasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error("Service Worker Error:", err));
            });
        }

        const iframe = document.getElementById('app-iframe');
        const overlay = document.getElementById('refresh-overlay');
        const baseUrl = iframe.src.split('?')[0];
        let isRefreshing = false;

        function refreshAppWithBlur() {
            if (isRefreshing) return;
            isRefreshing = true;

            // 1. Tampilkan animasi loading dan berikan efek blur pada iframe
            overlay.classList.add('active');
            iframe.classList.add('is-refreshing');

            // 2. Tangkap event ketika iframe sudah selesai memuat data baru
            iframe.onload = () => {
                // Beri jeda kecil agar proses render di dalam iframe benar-benar tuntas
                setTimeout(() => {
                    overlay.classList.remove('active');
                    iframe.classList.remove('is-refreshing');
                    isRefreshing = false;
                }, 300);
            };

            // 3. Perbarui sumber data iframe (tambahkan timestamp)
            iframe.src = baseUrl + '?t=' + new Date().getTime();
        }

        // Jalankan refresh saat pengguna kembali membuka PWA
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                setTimeout(refreshAppWithBlur, 300); // Jeda agar internet HP siap
            }
        });

        // Jalankan refresh jika halaman dipanggil dari cache
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                setTimeout(refreshAppWithBlur, 300);
            }
        });
    </script>

</body>
</html>
