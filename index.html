<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timeline</title>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }

        #iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            background-color: #f8fafc;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        /* OVERLAY LOADING & BLUR */
        #refresh-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(248, 250, 252, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #refresh-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .refresh-spinner {
            border: 4px solid rgba(47, 68, 56, 0.1); /* Warna sage pudar */
            width: 42px; height: 42px;
            border-radius: 50%;
            border-left-color: #2f4438; /* Warna primer sage */
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        .refresh-text {
            color: #2f4438;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

    <!-- OVERLAY LOADING -->
    <div id="refresh-overlay">
        <div class="refresh-spinner"></div>
        <div class="refresh-text">MENCARI TIMELINE...</div>
    </div>

    <!-- IFRAME CONTAINER -->
    <div id="iframe-container">
        <iframe id="app-iframe" src="https://script.google.com/macros/s/AKfycbzsYkQ6yj1rCV97jWoQCTaW711pmmR-yJaKzca00LyhytgyCBwWb7S-nbmgq0fG1mif/exec" 
                allow="camera; geolocation; microphone; fullscreen" 
                allowfullscreen>
        </iframe>
    </div>

    <script>
        // Registrasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error("Service Worker Error:", err));
            });
        }

        const baseUrl = "https://script.google.com/macros/s/AKfycbzsYkQ6yj1rCV97jWoQCTaW711pmmR-yJaKzca00LyhytgyCBwWb7S-nbmgq0fG1mif/exec";
        let isRefreshing = false;

        function refreshAppWithLoading() {
            if (isRefreshing) return;
            isRefreshing = true;

            const container = document.getElementById('iframe-container');
            const oldIframe = document.getElementById('app-iframe');
            const overlay = document.getElementById('refresh-overlay');

            // 1. Tampilkan layar blur dan loading terlebih dahulu
            overlay.classList.add('active');

            // 2. Buat iframe baru
            const newIframe = document.createElement('iframe');
            newIframe.setAttribute('allow', 'camera; geolocation; microphone; fullscreen');
            newIframe.setAttribute('allowfullscreen', 'true');
            newIframe.style.opacity = '0'; 
            
            // 3. Masukkan ke DOM agar mulai memuat
            container.appendChild(newIframe);

            // 4. Tunggu HINGGA halaman di dalam iframe benar-benar termuat sempurna
            newIframe.onload = () => {
                
                // Munculkan iframe baru secara visual
                setTimeout(() => {
                    newIframe.style.opacity = '1';
                }, 50);

                // Setelah iframe baru stabil, hapus iframe lama DAN hilangkan layar loading
                setTimeout(() => {
                    if (oldIframe && oldIframe.parentNode) {
                        oldIframe.remove();
                    }
                    newIframe.id = 'app-iframe';
                    
                    // Hilangkan efek blur dan loading
                    overlay.classList.remove('active');
                    isRefreshing = false;
                }, 400); // Jeda tambahan memastikan render visual sudah mulus
            };

            // 5. Eksekusi pemanggilan data (tambahkan parameter waktu agar tidak kena cache)
            newIframe.src = baseUrl + '?t=' + new Date().getTime();
        }

        // Pemicu saat aplikasi dibuka dari background
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                setTimeout(refreshAppWithLoading, 300);
            }
        });

        // Pemicu saat aplikasi dipanggil dari cache navigasi (kembali/maju)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                setTimeout(refreshAppWithLoading, 300);
            }
        });
    </script>

</body>
</html>
