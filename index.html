<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timeline</title>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }

        #iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
            background-color: #f8fafc;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        /* OVERLAY LOADING & BLUR */
        #refresh-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(248, 250, 252, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #refresh-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ANIMASI POHON SAGE */
        .tree-loader {
            margin-bottom: 24px;
            width: 64px;
            height: 64px;
        }

        .tree-trunk {
            stroke: #877f72; /* Fundy Slate */
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .leaf {
            animation: leaf-breathe 1.5s infinite alternate ease-in-out;
        }

        /* Mengatur titik pusat skala masing-masing daun sesuai koordinat cx & cy */
        .leaf-1 { fill: #2f4438; transform-origin: 32px 16px; animation-delay: 0s; }    /* Evergreen */
        .leaf-2 { fill: #b0b7a0; transform-origin: 18px 28px; animation-delay: 0.4s; }  /* Dry Leaf */
        .leaf-3 { fill: #877f72; transform-origin: 46px 24px; animation-delay: 0.8s; }  /* Fundy Slate */

        @keyframes leaf-breathe {
            0% { transform: scale(0.85); opacity: 0.7; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .refresh-text {
            color: #2f4438;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <!-- OVERLAY LOADING POHON -->
    <div id="refresh-overlay">
        <svg class="tree-loader" viewBox="0 0 64 64">
            <!-- Batang dan Ranting -->
            <path class="tree-trunk" d="M32 60 L32 24" />
            <path class="tree-trunk" d="M32 42 L20 32" />
            <path class="tree-trunk" d="M32 36 L44 26" />
            
            <!-- Daun / Foliage -->
            <circle cx="32" cy="16" r="12" class="leaf leaf-1" />
            <circle cx="18" cy="28" r="10" class="leaf leaf-2" />
            <circle cx="46" cy="24" r="9"  class="leaf leaf-3" />
        </svg>
        <div class="refresh-text">MENCARI TIMELINE...</div>
    </div>

    <!-- IFRAME CONTAINER -->
    <div id="iframe-container">
        <iframe id="app-iframe" src="https://script.google.com/macros/s/AKfycbzsYkQ6yj1rCV97jWoQCTaW711pmmR-yJaKzca00LyhytgyCBwWb7S-nbmgq0fG1mif/exec" 
                allow="camera; geolocation; microphone; fullscreen" 
                allowfullscreen>
        </iframe>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error("Service Worker Error:", err));
            });
        }

        const baseUrl = "https://script.google.com/macros/s/AKfycbzsYkQ6yj1rCV97jWoQCTaW711pmmR-yJaKzca00LyhytgyCBwWb7S-nbmgq0fG1mif/exec";
        let isRefreshing = false;

        function refreshAppWithLoading() {
            if (isRefreshing) return;
            isRefreshing = true;

            const container = document.getElementById('iframe-container');
            const oldIframe = document.getElementById('app-iframe');
            const overlay = document.getElementById('refresh-overlay');

            overlay.classList.add('active');

            const newIframe = document.createElement('iframe');
            newIframe.setAttribute('allow', 'camera; geolocation; microphone; fullscreen');
            newIframe.setAttribute('allowfullscreen', 'true');
            newIframe.style.opacity = '0'; 
            
            container.appendChild(newIframe);

            newIframe.onload = () => {
                setTimeout(() => {
                    newIframe.style.opacity = '1';
                }, 50);

                setTimeout(() => {
                    if (oldIframe && oldIframe.parentNode) {
                        oldIframe.remove();
                    }
                    newIframe.id = 'app-iframe';
                    
                    overlay.classList.remove('active');
                    isRefreshing = false;
                }, 400); 
            };

            newIframe.src = baseUrl + '?t=' + new Date().getTime();
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                setTimeout(refreshAppWithLoading, 300);
            }
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                setTimeout(refreshAppWithLoading, 300);
            }
        });
    </script>

</body>
</html>
